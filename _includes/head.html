<script>
document.documentElement.classList.add('js');
// v1 participant gate. Not security: it keeps casual visitors out of
// participants/, nothing more. The value is a PBKDF2-SHA256 hash of the
// password (salt "coding-provenance-2026", 310000 iterations); see README.
window.CP_ACCESS = '062700d22bef93b41f571f6d42141770156273d443aee65560a75a34b747d1ec';
(function () {
  var path = location.pathname;
  var at = path.indexOf('/participants/');
  if (at === -1) return;
  var token = null;
  try { token = sessionStorage.getItem('cp-access') || localStorage.getItem('cp-access'); } catch (e) {}
  if (token === window.CP_ACCESS) return;
  var next = path.slice(at + '/participants/'.length) || 'index.html';
  location.replace('../access.html?next=' + encodeURIComponent(next));
})();
</script>
<meta name="theme-color" content="#f6f6f2">
