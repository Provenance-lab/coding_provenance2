<!doctype html>
<!-- Source of images/og-card.png, the share image (1200 × 630). To update it: edit the text below,
     open this file in a browser at a 1200 × 630 viewport (device scale 1) and save a screenshot
     over images/og-card.png. Quarto ignores folders that start with "_", so this is not published. -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Archivo"; src: url("../fonts/archivo-latin.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
html, body { margin: 0; }
body { width: 1200px; height: 630px; position: relative; overflow: hidden; background: #f6f6f2; color: #1b1c19; font-family: "Archivo", sans-serif; font-feature-settings: "kern"; }
.rule { position: absolute; top: 0; bottom: 0; width: 2px; background: #b0241b; }
.r1 { left: 132px; } .r2 { left: 137px; }
.no { position: absolute; right: calc(1200px - 108px); top: 104px; color: #b0241b; font-weight: 650; font-size: 26px; font-feature-settings: "tnum", "lnum"; white-space: nowrap; }
.title { position: absolute; left: 176px; top: 82px; margin: 0; font-weight: 800; font-stretch: 122%; font-size: 96px; line-height: 88.5px; letter-spacing: -0.03em; }
.edition { position: absolute; left: 178px; top: 370px; margin: 0; font-weight: 400; font-stretch: 112%; font-size: 39.5px; color: #4a4d46; letter-spacing: -0.005em; }
.record { position: absolute; left: 178px; right: 64px; top: 458px; height: 81px; border-top: 1px solid #7f97b2; border-bottom: 1px solid #bccadb; display: grid; grid-template-columns: 271px auto; }
.field { padding-top: 15px; }
.label { font-weight: 600; font-stretch: 75%; font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; color: #4a4d46; }
.value { margin-top: 5px; font-weight: 500; font-size: 25px; font-feature-settings: "tnum", "lnum"; }
</style></head>
<body>
  <div class="rule r1"></div><div class="rule r2"></div>
  <div class="no">No. 2</div>
  <h1 class="title">Coding<br>Provenance<br>Workshop</h1>
  <p class="edition">Second Edition · Materials</p>
  <div class="record">
    <div class="field"><div class="label">Dates</div><div class="value">December 1–4, 2026</div></div>
    <div class="field"><div class="label">Venue</div><div class="value">Getty Research Institute, Los Angeles</div></div>
  </div>
</body></html>
